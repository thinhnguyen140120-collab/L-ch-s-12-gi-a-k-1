<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn Tập & Thi Thử Trắc Nghiệm Lịch Sử 12 Giữa Kì 1 - Chuẩn GDPT 2018</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 6 Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    animation: {
                        fadeIn: 'fadeIn 0.3s ease-in-out',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(6px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Định dạng tối ưu khi In ra giấy hoặc Xuất PDF (Ctrl + P) */
        @media print {
            header, footer, .sticky, button, select, input, .no-print {
                display: none !important;
            }
            body {
                background: white !important;
                color: black !important;
            }
            #app-viewport {
                max-width: 100% !important;
                padding: 0 !important;
            }
            .shadow-sm, .shadow-md, .shadow-lg, .shadow-xl {
                box-shadow: none !important;
            }
            .border {
                border-color: #cbd5e1 !important;
            }
            .page-break {
                page-break-after: always;
            }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col custom-scrollbar">

    <!-- 1. HEADER (Navbar Sticky) -->
    <header class="sticky top-0 z-50 bg-indigo-800 text-white shadow-lg border-b border-indigo-700">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <button onclick="app.navigateTo('home')" class="flex items-center space-x-3 text-left focus:outline-none group">
                <div class="w-10 h-10 bg-white rounded-xl flex items-center justify-center shadow-md text-indigo-800 group-hover:scale-105 transition-transform">
                    <i class="fa-solid fa-landmark text-xl"></i>
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-black leading-tight tracking-tight">Lịch Sử 12 - GDPT Mới</h1>
                    <p class="text-[11px] text-indigo-200 font-medium">Ôn Tập Giữa Kì 1 (Bài 1 - Bài 5)</p>
                </div>
            </button>

            <!-- Navigation Links -->
            <nav class="flex items-center space-x-1 sm:space-x-2 overflow-x-auto py-1">
                <button onclick="app.navigateTo('home')" id="nav-home-btn" class="px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-indigo-700 text-indigo-100 transition-colors flex items-center space-x-1.5">
                    <i class="fa-solid fa-house"></i>
                    <span class="hidden md:inline">Trang chủ</span>
                </button>
                <button onclick="app.navigateTo('practice', 'all')" id="nav-practice-btn" class="px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-indigo-700 text-indigo-100 transition-colors flex items-center space-x-1.5">
                    <i class="fa-solid fa-layer-group"></i>
                    <span class="hidden md:inline">Luyện tập</span>
                </button>
                <button onclick="app.startExam()" id="nav-exam-btn" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-amber-400 hover:bg-amber-500 text-slate-900 shadow transition-colors flex items-center space-x-1.5 font-black">
                    <i class="fa-solid fa-stopwatch"></i>
                    <span>Thi thử 45p</span>
                </button>
                <button onclick="app.navigateTo('mistakes')" id="nav-mistakes-btn" class="px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-indigo-700 text-indigo-100 transition-colors flex items-center space-x-1.5">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span class="hidden md:inline">Câu sai</span>
                </button>
                <button onclick="app.navigateTo('bookmarks')" id="nav-bookmarks-btn" class="px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-indigo-700 text-indigo-100 transition-colors flex items-center space-x-1.5">
                    <i class="fa-solid fa-star"></i>
                    <span class="hidden md:inline">Đã lưu</span>
                </button>
                <button onclick="app.navigateTo('stats')" id="nav-stats-btn" class="px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-indigo-700 text-indigo-100 transition-colors flex items-center space-x-1.5">
                    <i class="fa-solid fa-chart-pie"></i>
                    <span class="hidden md:inline">Thống kê</span>
                </button>
            </nav>
        </div>
    </header>

    <!-- 2. MAIN CONTENT VIEWPORT -->
    <main id="app-viewport" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
        <!-- Nội dung động được render bởi app.js -->
    </main>

    <!-- 3. FOOTER -->
    <footer class="bg-slate-900 text-slate-400 py-6 border-t border-slate-800 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center space-y-2">
            <p class="text-xs sm:text-sm font-medium">© 2026 Hệ Thống Ôn Thi Trắc Nghiệm Lịch Sử Lớp 12 - Chương Trình GDPT 2018.</p>
            <p class="text-xs text-slate-500">
                Toàn diện 5 bài học: Bài 1 (Liên Hợp Quốc) • Bài 2 (Trật tự 2 cực I-an-ta) • Bài 3 (Trật tự đa cực) • Bài 4 (Sự ra đời ASEAN) • Bài 5 (Cộng đồng ASEAN)
            </p>
        </div>
    </footer>

    <!-- 4. DATABASE & SCRIPTS -->
    <script src="data_lesson1.js"></script>
    <script src="data_lesson2.js"></script>
    <script src="data_lesson3.js"></script>
    <script src="data_lesson4.js"></script>
    <script src="data_lesson5.js"></script>
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
